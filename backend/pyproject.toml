[project]
name = "chenxing-ai-stack"
version = "1.0.0"
description = "企业 RAG/Agent 平台 - 模块化、版本锁定、可一键复现的 AI 应用开发运行环境"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "pydantic>=2.10,<2.11",
    "pydantic-settings>=2.7,<2.8",
    "httpx>=0.28,<0.29",
    "python-multipart>=0.0.20,<0.0.21",
    "qdrant-client>=1.13,<1.14",
    "langgraph>=0.2.60,<1.3",
    "pyjwt>=2.10,<2.11",
    "pypdf>=5.0,<6.0",
    "python-docx>=1.1,<1.2",
    "opentelemetry-api>=1.20,<2.0",
    "opentelemetry-sdk>=1.20,<2.0",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.3,<4.0"]
dev = ["pytest>=8.3,<9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
